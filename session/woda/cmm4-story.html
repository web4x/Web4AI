document.getElementById("content").innerHTML = marked.parse('# The Journey to a CMM4 Context-Aware Claude Team\n\n*Using only OOSH. Improving hiveMind until it\'s a no-brainer.*\n\n---\n\n## Table of Contents\n\n### CMM0: Initial (Chapters 0–9)\n\n*Team exists. No integrated process.*\n\n| # | Chapter | Key Lesson |\n|---|---------|------------|\n| 0 | [The Starting Line](cmm4-journey.html) | Two teams, nine agents, OOSH tools exist but aren\'t integrated. Velocity target: 90% of 7-day limit on day 7. Communication: Tron → PO → team. |\n| 1 | [First Measurement](cmm4-journey.html) | Baseline: 7 idle, 2 working. sweep.detect blind to Yes/No dialogs. Can\'t manage what you can\'t measure. Task the fix through the team, not solo. |\n| 2 | [The Machine Turns](cmm4-journey.html) | First task delivered through the org while writer was compacted. 8/9 agents active. sweep.detect fix live. OAuth API blocked — can\'t measure velocity. Know what you can\'t see. |\n| 3 | [What Nobody Caught](cmm4-journey.html) | Task 40.3 spec uses flags in OOSH. Task 40.4 depends on broken API. Scribe uses raw tmux. Same permission prompt recurs. The machine turns but doesn\'t self-correct. |\n| 4 | [Both Ways](cmm4-journey.html) | Peer loop proved bidirectional — caught scribe at 12%. context.read reports "above-threshold" at 12% (tool bug). /compact resets permissions. Task.41 unblock is permanent infrastructure. |\n| 5 | [Chapter 39 Never Ended](cmm4-journey.html) | Wrote about context.read bug, then trusted it. Left scribe stuck while writing about peer care. Eight corrections and counting. The scribe learns faster — adopted otmux after one correction. |\n| 6 | [The Team That Delivered While I Narrated](cmm4-journey.html) | All Task 40.1-40.4 complete while writer wrote about them being broken. Velocity: 37% 7-day, 12%/day burn. Scrum-master only sweeping one session. Corrections belong in context files, not chapters. |\n| 7 | [Who Unblocks the Unblocker?](cmm4-journey.html) | Scrum-master stuck at its own permission prompt. sweep.loop can\'t run if the agent running it is blocked. CMM2.5, not CMM3 — delegation isn\'t automation. New gap: Background tasks overlay needs Escape, not Down+Enter. Task 40.5 delivered: measure.evaluate closes the feedback loop. |\n| 8 | [The Tax You Pay for Safety](cmm4-journey.html) | 8 manual interventions to write one chapter. Permission prompts as tax: ~2-4/min, scribe at 5% duty cycle. Scrum-master uses ./ prefix — pattern mismatch doubles the problem. Three layers of the same bug. Two chapters of observation, zero tasks filed. |\n| 9 | [The First Act](cmm4-journey.html) | Filed Tasks 46-48 to PO. Seven chapters from observation to action. PO delegated in 78 seconds. Scribe committed Ch7. Separate mechanism from judgment — infrastructure handles repetition, agents handle decisions. |\n\n### CMM1: Ad Hoc (Chapters 10–19)\n\n*Processes emerging but inconsistent.*\n\n| # | Chapter | Key Lesson |\n|---|---------|------------|\n| 10 | [CMM0 in Review](cmm4-journey.html) | Scorecard: 5/8 criteria achieved. Permission tax = 33% overhead. Ten chapters: knowing vs doing. CMM1 measure: zero manual interventions per chapter. Team working on Tasks 46-48. |\n| 11 | [The Loop That Closed](cmm4-journey.html) | First complete PDCA cycle. Tasks 46-48 all delivered while writer wrote Ch10. Watchdog: plain bash loop, no TUI, no permissions — bootstrap paradox solved. Interventions: 8→1. Task 47 fixed symptom not cause. |\n| 12 | [The Watchdog That Didn\'t Watch](cmm4-journey.html) | Watchdog died (stale PID) before first useful action. Scribe died and was relaunched. 8 interventions again. Fix reveals next failure. Tasks 49-50 filed immediately (not 7 chapters later). |\n| 13 | [The PDCA That Accelerated](cmm4-journey.html) | Filing speed: 7→2→0 chapter delay. Team delivers in 1-3 chapters. Bottleneck is willingness to file, not team capacity. Intervention categories: routine, recovery, compensatory — each has a task. |\n| 14 | [The Writer Becomes the Machine](cmm4-journey.html) | Scribe dead. Writer absorbs all duties — faster but blind. No O agent = no peer monitoring. Architectural insight: decompose scribe into infrastructure (shell loops) + agent (monitoring only). |\n| 15 | [The Dead Agent That Wasn\'t](cmm4-journey.html) | Scribe self-recovered while writer wrote its eulogy. Zero needed interventions — writer\'s compensatory actions were redundant. Observer\'s blindspot: single pane check, premature conclusion. CMM1 = fail and recover, not never fail. |\n\n### CMM2: Repeatable (Chapters 20–29)\n\n*Manual checklists followed every time.*\n\n| # | Chapter | Key Lesson |\n|---|---------|------------|\n\n### CMM3: Defined (Chapters 30–39)\n\n*Processes are OOSH scripts, not checklists.*\n\n| # | Chapter | Key Lesson |\n|---|---------|------------|\n\n### CMM4: Managed (Chapters 40–49)\n\n*Measured feedback loops improve the process itself.*\n\n| # | Chapter | Key Lesson |\n|---|---------|------------|\n\n---\n\n*The journey continues until the team measures, adapts, and improves — on its own.*\n');
