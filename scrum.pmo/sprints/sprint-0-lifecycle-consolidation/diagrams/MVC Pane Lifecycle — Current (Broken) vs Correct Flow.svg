ke-width:2;" x1="351.0757" x2="731.5522" y1="1570.5215" y2="1570.5215"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5732" x="363.0757" y="1535.1582">2. swap pane titles:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.6372" x="363.0757" y="1550.4688">otmux pane.title 0.1 &lt;roleB&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1289" x="363.0757" y="1565.7793">otmux pane.title 0.2 &lt;roleA&gt;</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg22"><polygon fill="#181818" points="352.0757,1626.4531,342.0757,1630.4531,352.0757,1634.4531,348.0757,1630.4531" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="346.0757" x2="736.5522" y1="1630.4531" y2="1630.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.7549" x="358.0757" y="1595.0898">3. swap HIVEMIND_ROLE env:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.9849" x="358.0757" y="1610.4004">otmux send.enter 0.1 "export HIVEMIND_ROLE=&lt;roleB&gt;"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.4766" x="358.0757" y="1625.7109">otmux send.enter 0.2 "export HIVEMIND_ROLE=&lt;roleA&gt;"</text></g><path d="M742,1643.4531 L742,1775.4531 L1014,1775.4531 L1014,1653.4531 L1004,1643.4531 L742,1643.4531" fill="#CCFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M1004,1643.4531 L1004,1653.4531 L1014,1653.4531 L1004,1643.4531" fill="#CCFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="237.5039" x="748" y="1661.0215">Three things must update on swap:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1216" x="748" y="1676.332">1. Registry (Controller state)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.29" x="748" y="1691.6426">2. Pane titles (View labels)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.8433" x="748" y="1706.9531">3. HIVEMIND_ROLE env (Model-in-View)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="748" y="1722.2637">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9912" x="748" y="1737.5742">Without #3: sender prefix shows</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.3804" x="748" y="1752.8848">wrong identity ([@PO-shell] instead</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.4189" x="748" y="1768.1953">of [@scrum-master])</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg23"><polygon fill="#181818" points="324.0757,1823.248,334.0757,1827.248,324.0757,1831.248,328.0757,1827.248" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="23.9346" x2="330.0757" y1="1827.248" y2="1827.248"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0195" x="30.9346" y="1822.5059">otmux pane.kill ooshTeam:0.3</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg24"><line style="stroke:#181818;stroke-width:2;" x1="346.0757" x2="388.0757" y1="1871.8691" y2="1871.8691"/><line style="stroke:#181818;stroke-width:2;" x1="388.0757" x2="388.0757" y1="1871.8691" y2="1884.8691"/><line style="stroke:#181818;stroke-width:2;" x1="347.0757" x2="388.0757" y1="1884.8691" y2="1884.8691"/><polygon fill="#181818" points="357.0757,1880.8691,347.0757,1884.8691,357.0757,1888.8691,353.0757,1884.8691" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.2183" x="353.0757" y="1851.8164">tmux kill-pane</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3223" x="353.0757" y="1867.127">(indices shift down)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg25"><polygon fill="#181818" points="720.5522,1925.4902,730.5522,1929.4902,720.5522,1933.4902,724.5522,1929.4902" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="346.0757" x2="726.5522" y1="1929.4902" y2="1929.4902"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.9033" x="353.0757" y="1909.4375">hiveMind protected.pane.removed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.1768" x="353.0757" y="1924.748">(session, removed_index)</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg26"><polygon fill="#181818" points="995.6616,1970.1113,1005.6616,1974.1113,995.6616,1978.1113,999.6616,1974.1113" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="737.5522" x2="1001.6616" y1="1974.1113" y2="1974.1113"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.9175" x="744.5522" y="1954.0586">remove entry for 0.3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.6494" x="744.5522" y="1969.3691">shift 0.4&#8594;0.3, 0.5&#8594;0.4</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg27"><polygon fill="#181818" points="324.0757,2024.4219,334.0757,2028.4219,324.0757,2032.4219,328.0757,2028.4219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="23.9346" x2="330.0757" y1="2028.4219" y2="2028.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.1411" x="30.9346" y="2023.6797">otmux pane.move ooshTeam:0.2 otherSession</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg28"><line style="stroke:#181818;stroke-width:2;" x1="346.0757" x2="388.0757" y1="2057.7324" y2="2057.7324"/><line style="stroke:#181818;stroke-width:2;" x1="388.0757" x2="388.0757" y1="2057.7324" y2="2070.7324"/><line style="stroke:#181818;stroke-width:2;" x1="347.0757" x2="388.0757" y1="2070.7324" y2="2070.7324"/><polygon fill="#181818" points="357.0757,2066.7324,347.0757,2070.7324,357.0757,2074.7324,353.0757,2070.7324" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.4399" x="353.0757" y="2052.9902">tmux move-pane</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg29"><polygon fill="#181818" points="720.5522,2111.3535,730.5522,2115.3535,720.5522,2119.3535,724.5522,2115.3535" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="346.0757" x2="726.5522" y1="2115.3535" y2="2115.3535"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="213.3765" x="353.0757" y="2095.3008">hiveMind protected.pane.moved</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.1899" x="353.0757" y="2110.6113">(from_session:pane, to_session:pane)</text></g><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg30"><polygon fill="#181818" points="995.6616,2155.9746,1005.6616,2159.9746,995.6616,2163.9746,999.6616,2159.9746" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:2;" x1="737.5522" x2="1001.6616" y1="2159.9746" y2="2159.9746"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.0518" x="744.5522" y="2139.9219">remove from source session</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2373" x="744.5522" y="2155.2324">add to target session</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1203.0962" x="0" y="2188.6299"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2188.6299" y2="2188.6299"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2191.6299" y2="2191.6299"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="223.3711" x="489.8625" y="2177.9746"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.0864" x="495.8625" y="2194.543">MODEL LAYER &#8212; UNAFFECTED</text><path d="M605,2216.2852 L605,2348.2852 L1154,2348.2852 L1154,2226.2852 L1144,2216.2852 L605,2216.2852" fill="#FFFFE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M1144,2216.2852 L1144,2226.2852 L1154,2226.2852 L1144,2216.2852" fill="#FFFFE0" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="389.7144" x="611" y="2233.8535">claudeCode sessions are bound to TTYs, not pane indices.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.1313" x="611" y="2249.1641">When panes split/swap/move, the Claude process stays on its TTY.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="528.3281" x="611" y="2264.4746">The TTY&#8594;pane mapping changes (tmux renumbers), but the process doesn't move.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="611" y="2279.7852">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.499" x="611" y="2295.0957">claudeCode.session.id uses: ps args &#8594; sessions.env &#8594; JSONL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.3926" x="611" y="2310.4063">None of these reference pane indices &#8212; they use TTY or UUID.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="611" y="2325.7168">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="417.8903" x="611" y="2341.0273">Model is portable. Only View&#8596;Controller binding needs fixing.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1203.0962" x="0" y="2374.4248"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2374.4248" y2="2374.4248"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2377.4248" y2="2377.4248"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="304.0054" x="449.5454" y="2363.7695"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="285.7207" x="455.5454" y="2380.3379">PROTECTED METHODS NEEDED (hiveMind)</text><path d="M476,2402.0801 L476,2656.0801 L997,2656.0801 L997,2412.0801 L987,2402.0801 L476,2402.0801" fill="#CCFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M987,2402.0801 L987,2412.0801 L997,2412.0801 L987,2402.0801" fill="#CCFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="344.3159" x="482" y="2419.6484">New hiveMind protected methods for otmux to call:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="482" y="2434.959">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.4136" x="482" y="2450.2695">hiveMind.protected.panes.shifted &lt;session&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.75" x="490.2266" y="2465.5801">&#8212; re-scan pane list, remap registry by TTY matching</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1919" x="490.2266" y="2480.8906">&#8212; called after: split, kill (any op that renumbers)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="482" y="2496.2012">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.8589" x="482" y="2511.5117">hiveMind.protected.panes.swapped &lt;session&gt; &lt;paneA&gt; &lt;paneB&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.001" x="490.2266" y="2526.8223">&#8212; exchange two registry entries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4048" x="490.2266" y="2542.1328">&#8212; called after: pane.swap</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="482" y="2557.4434">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.458" x="482" y="2572.7539">hiveMind.protected.pane.moved &lt;from&gt; &lt;to&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.5811" x="490.2266" y="2588.0645">&#8212; remove from source, add to target session</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2705" x="490.2266" y="2603.375">&#8212; called after: pane.move, pane.join</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="482" y="2618.6855">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="429.2158" x="482" y="2633.9961">Pattern: same as existing protected.session.renamed (line 2505)</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="500.5889" x="482" y="2649.3066">Guard: command -v hiveMind &gt;/dev/null (otmux works without hiveMind)</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1203.0962" x="0" y="2682.7041"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2682.7041" y2="2682.7041"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1203.0962" y1="2685.7041" y2="2685.7041"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="319.7031" x="441.6965" y="2672.0488"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="301.4185" x="447.6965" y="2688.6172">OBSERVER PATTERN &#8212; EXISTING PRECEDENT</text><path d="M286,2710.3594 L286,2949.3594 L792,2949.3594 L792,2720.3594 L782,2710.3594 L286,2710.3594" fill="#ADD8E6" style="stroke:#181818;stroke-width:0.5;"/><path d="M782,2710.3594 L782,2720.3594 L792,2720.3594 L782,2710.3594" fill="#ADD8E6" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="394.5576" x="319.5479" y="2727.9277">Already implemented for session rename (otmux line 183):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="319.5479" y="2743.2383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9888" x="319.5479" y="2758.5488">otmux.rename() calls:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.9067" x="327.7744" y="2773.8594">command -v hiveMind &gt;/dev/null 2&gt;&amp;1 &amp;&amp;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.853" x="336.001" y="2789.1699">hiveMind protected.session.renamed "$oldName" "$newName"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="319.5479" y="2804.4805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="228.2871" x="319.5479" y="2819.791">Same pattern for pane operations:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="319.5479" y="2835.1016">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.3428" x="319.5479" y="2850.4121">otmux.split.h() should call:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.9067" x="327.7744" y="2865.7227">command -v hiveMind &gt;/dev/null 2&gt;&amp;1 &amp;&amp;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.6777" x="336.001" y="2881.0332">hiveMind protected.panes.shifted "$session"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="319.5479" y="2896.3438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7646" x="319.5479" y="2911.6543">otmux.pane.swap() should call:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.9067" x="327.7744" y="2926.9648">command -v hiveMind &gt;/dev/null 2&gt;&amp;1 &amp;&amp;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spac